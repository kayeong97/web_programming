<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 가운데 정렬 */
      p {
        text-align: center;
        font-weight: bold;
      }
      .card {
        width: 200px;
        height: 100px;
        border: 2px solid gray;
        border-radius: 10px;
        background-color: lightgray;
        padding: 20px;
        box-sizing: border-box;
        background-image: url("코알라.jpg");
        /* background-size: cover; */
        background-size: contain;
        background-repeat: no-repeat;
      }
      .left {
        background-color: skyblue;
        width: 100px;
        height: 100px;
        float: left;
      }
      .right {
        background-color: orange;
        width: 100px;
        height: 100px;
        float: left;
      }
      .text {
        clear: both;
      }
    </style>
  </head>
  <body>
    <!-- float를 사용한 레이아웃 -->
    <div class="left">왼쪽 박스</div>
    <div class="right">오른쪽 박스</div>
    <div class="text">이 문장은 두 박스 아래쪽에 오게 하세요.</div>
    <!-- 코알라 카드 박스 -->
    <div class="card">카드박스</div>
    <!-- p 중앙 정렬 -->
    <div class="box1">
      <p>일반 문단</p>
      <p class="highlight">강조 문단</p>
    </div>
    <div class="box6">
      <p>회원가입 완료</p>
      <p>결제 완료</p>
    </div>
    <div class="box7">
      <p>CSS 선택자</p>
      <p>CSS 선택자는 매우 다양합니다.</p>
    </div>
    <div class="box8">
      <h1>제목</h1>
      <p>첫 번째 단락</p>
      <p>두 번째 단락</p>
    </div>
    <div class="box9">
      <h1>제목</h1>
      <p>첫 번째 단락</p>
      <p>두 번째 단락</p>
    </div>
    <div class="box10">
      <ul>
        <li><a href="report.pdf">보고서</a></li>
        <li><a href="image.png">이미지</a></li>
      </ul>
    </div>
  </body>
</html>
