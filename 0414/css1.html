<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* TODO: 아래 요구사항을 만족하도록 작성하세요. */
      .container {
        /* 컨테이너를 flex 로 설정하고, 중앙 정렬하기 */
        height: 200px;
        background-color: aqua;
        display: flex;
        justify-content: center; /* start는 왼쪽 end는 오른쪽 */
        align-items: center;
        gap: 10px;
        border-radius: 10px;
      }
      .container div {
        width: 80px;
        height: 80px;
        color: white;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
      }
      .container div:nth-child(1) {
        background: #2563eb;
      }
      .container div:nth-child(2) {
        background: #059669;
      }
      .container div:nth-child(3) {
        background: #dc2626;
      }
    </style>
  </head>
  <body>
    <h2>Flexbox 기본 정렬 실습</h2>
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>
  </body>
</html>
