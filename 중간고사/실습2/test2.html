<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <h3>시작 그룹</h3>
      <!-- 라디오 버튼은 label에 연결됨 -->
      <input type="radio" name="start-group" id="new-tab" />
      <label for="new-tab">새 탭 페이지 열기</label>

      <input type="radio" name="start-group" id="continue" />
      <label for="continue">중단한 위치에서 계속하기</label>

      <input type="radio" name="start-group" id="specific-pages" />
      <label for="specific-pages">특정 페이지 또는 페이지 집합 열기</label>
    </div>
    <div>
      <h3>개인정보 및 보안</h3>
      <input type="checkbox" />동기화 및 서비스 <br />
      <input type="checkbox" />로그인 허용 <br />
      <input type="checkbox" />페이지 미리 로드
    </div>
  </body>
</html>
